# ============================================================
# Student Alcohol Consumption — Full Stack (4 containers)
#
# Services boot in this order:
#   mysql  →  etl (exits after load)  →  api  →  frontend
#
# Usage:
#   docker compose up --build
#
# Dashboard:  http://localhost:3000
# API:        http://localhost:5000/api/health
# ============================================================

services:

  # ── 1. MySQL Data Warehouse ─────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: stud_dw_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-12345}
      MYSQL_DATABASE:      ${DB_NAME:-stud_constellation_dw}
    ports:
      - "3307:3306"          # 3307 avoids clash with any local MySQL
    volumes:
      - ./data/database/Student_Alc_DB.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "-p${DB_PASSWORD:-12345}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - dw_net

  # ── 2. ETL Pipeline (run-once job) ──────────────────────────
  etl:
    build:
      context: .
      dockerfile: Dockerfile.etl
    container_name: stud_dw_etl
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST:     mysql
      DB_PORT:     ${DB_PORT:-3306}
      DB_USER:     ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-12345}
      DB_NAME:     ${DB_NAME:-stud_constellation_dw}
    volumes:
      - ./data/raw:/app/data/raw:ro
    networks:
      - dw_net

  # ── 3. Flask REST API ────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: stud_dw_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      etl:
        condition: service_completed_successfully
    ports:
      - "5000:5000"
    environment:
      DB_HOST:     mysql
      DB_PORT:     ${DB_PORT:-3306}
      DB_USER:     ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-12345}
      DB_NAME:     ${DB_NAME:-stud_constellation_dw}
    # healthcheck lets the frontend depend_on: api: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dw_net

  # ── 4. React Frontend (nginx) ────────────────────────────────
  frontend:
    build:
      context: ../../src/frontend      # path relative to docker-compose.yml
      dockerfile: Dockerfile.frontend
    container_name: stud_dw_frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - dw_net

  # ── 5. Metabase ──────────────────────────────────────────────
  metabase:
    image: metabase/metabase:latest
    container_name: stud_dw_metabase
    restart: unless-stopped
    ports:
      - "32768:3000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MB_DB_TYPE: h2        # Metabase's own internal config DB (default)
    networks:
      - dw_net              # same network as mysql — so host = "mysql"

# ── Volumes & Networks ───────────────────────────────────────
volumes:
  mysql_data:

networks:
  dw_net:
    driver: bridge
