# nginx.conf — served inside the frontend container
# All /api/* requests are proxied to the Flask API container so the browser
# never makes cross-origin calls (no CORS issues) and the API host is never
# hardcoded in the JavaScript bundle.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the React SPA — fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* → Flask API container
    # "api" resolves to the Docker service name on the shared dw_net network
    location /api/ {
        proxy_pass         http://api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Surface Flask errors clearly during development
        proxy_intercept_errors off;
    }
}
